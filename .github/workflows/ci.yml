name: LedgerFlow CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerflow_app
          POSTGRES_PASSWORD: ledgerflow_test_password
          POSTGRES_DB: ledgerflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow_app -d ledgerflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt email-validator
      - run: python -m ruff check app tests
        continue-on-error: true
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://ledgerflow_app:ledgerflow_test_password@localhost:5432/ledgerflow_db
          SECRET_KEY: ci-only-test-secret-key-not-for-production
